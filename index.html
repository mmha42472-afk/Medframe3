<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFrame Studio | منصة بناء وإدارة مواقع الأطباء</title>
    <meta name="description" content="منصة سحابية متطورة للأطباء والمراكز الطبية لبناء وتخصيص مواقع إلكترونية احترافية وإدارة الملفات الطبية مع دعم كامل للغة العربية ونظام أمان متقدم." />
    <meta property="og:title" content="MedFrame Studio | منصة بناء وإدارة مواقع الأطباء" />
    <meta property="og:description" content="منصة سحابية متطورة للأطباء والمراكز الطبية لبناء وتخصيص مواقع إلكترونية احترافية وإدارة الملفات الطبية مع دعم كامل للغة العربية ونظام أمان متقدم." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- GitHub Pages Trailing Slash Fix: Ensures relative assets (./assets/...) never 404 on repo root -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    
    <!-- Google Fonts for Arabic & Display Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d9488' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/><path d='M12 5v14'/><path d='M5 12h14'/></svg>" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-teal-500 selection:text-white min-h-screen">
    <div id="root"></div>

    <!-- Fallback if uncompiled source index.html is loaded directly on GitHub Pages root -->
    <script>
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs/')) {
          var clean = window.location.pathname.replace(/\/+$/, '');
          window.location.replace(clean + '/docs/' + window.location.search + window.location.hash);
        }
      }, 1200);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
