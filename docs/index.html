    <!-- Fail-safe redirection for GitHub Pages if deployed from root branch instead of /docs -->
    <script>
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        // If served on GitHub Pages root without compiled assets, redirect to /docs/ where production build lives
        if (host.endsWith('github.io') && !path.includes('/docs/')) {
          var parts = path.split('/').filter(Boolean);
          var repo = parts.length > 0 ? '/' + parts[0] : '';
          var target = repo + '/docs/' + window.location.search + window.location.hash;
          // Check if we are running the uncompiled root index.html
          if (!window.__VITE_PREVIEW__ && document.querySelector('script[src*="main.tsx"]')) {
            window.location.replace(target);
          }
        }
      })();
    </script>
